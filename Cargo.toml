[workspace]
members = [
    "crates/pipes-core",
    "crates/pipes-cli",
    "apps/desktop/src-tauri",
]
default-members = ["crates/pipes-core", "crates/pipes-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
humantime = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
thiserror = "2"
tempfile = "3"
assert_cmd = "2"
predicates = "3"
command-group = "5"
fs2 = "0.4"
ctrlc = "3"
libc = "0.2"
